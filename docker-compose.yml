version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Ganja Livre – Full local stack
#   Services: MongoDB, Temporal (+ its dependencies), API server, Worker
# ─────────────────────────────────────────────────────────────────────────────

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-true}
  MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DATABASE}?authSource=admin
  MONGODB_DATABASE: ${MONGODB_DATABASE:-ganja-livre}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  TEMPORAL_HOST_PORT: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: ganja-livre-sales

services:

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: gl-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-kaya_livre}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-ganja-livre}
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    ports:
      - "27017:27017"   # Remove in production — expose only internally
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Temporal dependencies ─────────────────────────────────────────────────
  temporal-postgresql:
    image: postgres:16-alpine
    container_name: gl-temporal-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24
    container_name: gl-temporal
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:-temporal}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamicconfig/docker.yaml
    volumes:
      - ./config/temporal-dynamic-config.yaml:/etc/temporal/dynamicconfig/docker.yaml:ro
    ports:
      - "7233:7233"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: gl-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8088:8080"
    networks:
      - backend

  # ── API Server ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: server
    container_name: gl-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      <<: *common-env
      SERVER_PORT: "8080"
    ports:
      - "8080:8080"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Temporal Worker ───────────────────────────────────────────────────────
  worker:
    build:
      context: .
      target: worker-image
    container_name: gl-worker
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      <<: *common-env
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mongodb_data:
  temporal_postgres_data:
