# Where are all the schema files using glob patterns?
schema:
  - schema.graphql

# Where should the generated server code go?
exec:
  filename: internal/graph/generated/generated.go
  package: generated

# Uncomment to enable federation
# federation:
#   filename: internal/graph/generated/federation.go
#   package: generated

# Where should any generated models go?
model:
  filename: internal/graph/model/models_gen.go
  package: model

# Where should the resolver implementations go?
resolver:
  layout: follow-schema
  dir: internal/graph/resolvers
  package: resolvers
  filename_template: "{name}.resolvers.go"

# Optional: turn on to use []Thing instead of []*Thing for slices
# omit_slice_element_pointers: false

# Optional: turn on to skip generating the gqlgen CLI
# skip_mod_tidy: false

# Optional: turn on to use struct tags on generated models
# struct_tags:
#   - json

# gqlgen will search for any type names in the schema in these go packages.
# If they are found, the module will be reused rather than generating a new one.
autobind:
  - "github.com/dani-zion/ganja-livre/internal/graph/model"

# This section declares type mapping between the GraphQL and Go type systems.
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Float:
    model:
      - github.com/99designs/gqlgen/graphql.Float
      - github.com/99designs/gqlgen/graphql.FloatContext
  String:
    model:
      - github.com/99designs/gqlgen/graphql.String
  Boolean:
    model:
      - github.com/99designs/gqlgen/graphql.Boolean